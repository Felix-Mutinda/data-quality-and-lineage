seeds:
  - name: series_catalog
    description: >
      The data contract per series: what it measures, its unit, its physical
      bounds and whether a constant value is suspicious. Every value here is
      justified in profiling/DECISIONS.md (D2). Empty max_value = no upper bound.
    config:
      column_types:
        min_value: double
        max_value: double
        stuck_check: boolean
