sources:
  - name: nab
    description: >
      NAB realAWSCloudwatch, pinned to numenta/NAB@ea702d7, loaded verbatim
      (all text) by ingest/load_warehouse.py.
    schema: raw
    tables:
      # Table names match the warehouse exactly (no `identifier:` alias), so the
      # dataset names in lineage events are the real table names.
      - name: nab_metrics
        description: One row per CSV line, exactly as published.
      - name: nab_anomaly_windows
        description: NAB's hand-labelled anomaly windows, one row per window.
