name: monitoring
version: "0.1.0"
config-version: 2
profile: monitoring

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  monitoring:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Detector and alerting settings, chosen from profiling/reports/detector_tuning.md (D7, D8)
  detector_baseline_readings: 288   # trailing 24 h at 5-minute cadence
  detector_z_threshold: 4
  alert_merge_minutes: 30
  alert_cooldown_minutes: 60

seeds:
  monitoring:
    +schema: reference

data_tests:
  monitoring:
    # Keep the rows each failing test found, in schema test_failures.
    +store_failures: true
    +schema: test_failures

dispatch:
  # Let this project override dbt_expectations macros
  # (macros/triageable_expression_is_true.sql).
  - macro_namespace: dbt_expectations
    search_order: ["monitoring", "dbt_expectations"]
